name: AOSP 特定 Tag 同步工具

on:
  workflow_dispatch: # 支持在 GitHub 网页端手动一键触发运行

jobs:
  fetch_and_pack:
    runs-on: ubuntu-latest
    steps:
      - name: 空间清理与最大化
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          
      - name: 精准提取 AOSP 源码快照并打包
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          mkdir aosp_source && cd aosp_source
          git init
          git remote add origin https://android.googlesource.com/kernel/common
          
          echo "正在从 Google 官方服务器精准拉取 r32 快照..."
          git fetch --depth 1 origin refs/tags/android16-6.12-2026-03_r32:refs/tags/android16-6.12-2026-03_r32
          git checkout refs/tags/android16-6.12-2026-03_r32 -b local_master
          
          echo "正在将大体积源码树打包为二进制本地 Bundle 文件，避免 HTTPS 网络传输碎片超时的限制..."
          git bundle create ../aosp_r32.bundle local_master
          
      - name: 暂存大文件至 GitHub 内部中转站
        uses: actions/upload-artifact@v4
        with:
          name: aosp-bundle
          path: aosp_r32.bundle
          retention-days: 1

  push_to_repo:
    needs: fetch_and_pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 签出当前仓库
        uses: actions/checkout@v4

      - name: 下载中转的二进制 Bundle 文件
        uses: actions/download-artifact@v4
        with:
          name: aosp-bundle

      - name: 解包并强制推送至当前 GitHub 仓库
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          echo "正在从本地二进制压缩流中恢复 Git 树..."
          git clone --depth=1 aosp_r32.bundle -b local_master recovered_source
          
          cd recovered_source
          git remote add github_repo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          
          echo "正在设置大文件传输缓冲区参数，确保强推不被中断..."
          git config --global http.postBuffer 1048576000
          git config --global ssh.postBuffer 1048576000
          git config --global core.compression 9
          
          echo "执行最终强推..."
          git push -f github_repo local_master:android16-6.12-2026-03-r32
