name: AOSP 特定 Tag 同步工具

on:
  workflow_dispatch:

jobs:
  sync_snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 空间清理与最大化
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h
          
      - name: 签出当前个人仓库（获取合法的 Git 凭证上下文）
        uses: actions/checkout@v4

      - name: 提取纯源码快照并作为单次提交强推
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 1. 建立一个源码目录
          mkdir aosp_workspace && cd aosp_workspace
          git init
          git remote add google_origin https://android.googlesource.com/kernel/common
          
          echo ">>> 正在从 Google 官方浅克隆 r32 纯源码切片 (无历史，通常仅需十几秒) ..."
          git fetch --depth 1 google_origin refs/tags/android16-6.12-2026-03_r32:refs/tags/android16-6.12-2026-03_r32
          git checkout refs/tags/android16-6.12-2026-03_r32
          
          echo ">>> 原地斩断 AOSP Git 历史，确保 100% 完整保留所有隐藏文件与目录结构 ..."
          rm -rf .git
          
          echo ">>> 重新初始化为个人初代干净仓库 ..."
          git init
          
          echo ">>> 正在本地提交全套纯源码文件 ..."
          git add -A
          git commit -m "Chore: Sync AOSP android16-6.12-2026-03_r32 pure source snapshot"
          
          # 2. 关联你自己的目标仓库并强推
          git remote add target_my_repo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          
          echo ">>> 正在将完美保留的 r32 纯源码分支推送到你的个人仓库..."
          git push -f target_my_repo HEAD:android16-6.12-2026-03-r32
