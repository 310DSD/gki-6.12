name: AOSP 特定 Tag 同步工具

on:
  workflow_dispatch: # 支持网页端手动一键触发

jobs:
  sync_tag_to_branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 确保 Action 有权限写入你的仓库
      
    steps:
      - name: 签出当前仓库
        uses: actions/checkout@v4

      - name: 精准拉取 AOSP 官方 Tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 1. 创建一个干净的临时目录并初始化
          mkdir aosp_source && cd aosp_source
          git init
          
          # 2. 关联 Google AOSP 官方源
          git remote add origin https://android.googlesource.com/kernel/common
          
          # 3. 极其精准地只拉取 r31 或 r32 标签（以 r31 为例，深度为 1，速度极快）
          # 如果你想用 r32，只需把下面的 android16-6.12-2026-03 r31 换成 android16-6.12-2026-03 r32（中间的空格换成斜杠或保持原样，取决于Git转义，官方写法是带空格的标签名，克隆时直接写标签全称即可）
          git fetch --depth 1 origin refs/tags/android16-6.12-2026-03/r31:refs/tags/android16-6.12-2026-03/r31
          
          # 4. 基于这个 Tag 创建一个本地的临时 master 分支
          git checkout refs/tags/android16-6.12-2026-03/r31 -b local_master

      - name: 强行推送到当前仓库的目标分支
        run: |
          cd aosp_source
          # 关联到你当前运行这个 Action 的个人 GitHub 仓库
          git remote add github_repo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          
          # 将这个快照点作为你个人仓库的一个全新分支（自定义命名为 android16-6.12-2026-03-r31）强推上去
          git push -f github_repo local_master:android16-6.12-2026-03-r31
